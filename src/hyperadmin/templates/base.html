{% extends "_base.html" %}

{#- The single inline-create popup slot (H6, v0.5.5): the autocomplete "+"

    `hyperadminPopupCreated`, Escape or a backdrop click. -#}
{% block messages %}
{{- super() }}
<link rel="stylesheet" href="{{ url_for('static', path='/css/_autocomplete.css') }}">
<script src="{{ url_for('static', path='/js/autocomplete.js') }}" defer></script>
<script src="{{ url_for('static', path='/js/primitives.js') }}" defer></script>
<div id="ha-popup-root" class="ha-popup-root" role="dialog" aria-modal="true"
     aria-label="{{ _('Create') }}" data-testid="popup-root"></div>
{%- endblock %}
