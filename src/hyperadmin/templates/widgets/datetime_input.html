{%- from "components/_macros.html" import field_wrapper -%}
{%- call field_wrapper(field) -%}
    <input id="{{- field.name -}}"
           name="{{- field.name -}}"
           type="datetime-local"
           step="1"
           value="{{- field.value|ha_datetime_input -}}"
           class="ha-input"
           aria-describedby="{{- field.name -}}-tz"
           aria-invalid="{{- 'true' if field.errors else 'false' -}}"
            {%- if widget.htmx_attrs -%}
                {%- for k, v in widget.htmx_attrs.items() -%} {{ k }}="{{ v }}"{%- endfor -%}
            {%- endif -%}
    />
    <p class="ha-help-text" id="{{- field.name -}}-tz" data-testid="{{- field.name -}}-tz">
        {%- trans tz=ha_timezone_name() -%}Time zone: {{ tz }}{%- endtrans -%}
    </p>
{%- endcall -%}
