services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hyperadmin
      POSTGRES_PASSWORD: hyperadmin
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperadmin -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  tasks_app:
    build:
      context: ../../
      dockerfile: examples/tasks/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hyperadmin:hyperadmin@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy
