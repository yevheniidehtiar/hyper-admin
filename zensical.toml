# Zensical configuration for the HyperAdmin documentation site.
# Docs: https://zensical.org/docs/

[project]
site_name = "HyperAdmin"
site_description = "A modern, Pydantic-native admin interface for FastAPI, powered by HTMX."
site_url = "https://yevheniidehtiar.github.io/hyper-admin"
repo_url = "https://github.com/yevheniidehtiar/hyper-admin"
repo_name = "yevheniidehtiar/hyper-admin"

nav = [
  { "Home" = "index.md" },
  { "Live Demo" = "demo.md" },
  { "Guide" = [
    { "Getting Started" = "getting-started.md" },
    { "Tutorial" = "tutorial.md" },
    { "Navigation, Lists & Keyboard" = "guides/navigation.md" },
    { "File Uploads" = "guides/file-uploads.md" },
    { "Existing FastAPI App" = "guides/existing-app.md" },
    { "Bring Your Own Auth" = "guides/external-auth.md" },
    { "OAuth Sign-In" = "guides/oauth-sso.md" },
    { "Realtime" = "guides/realtime.md" },
    { "Background Tasks" = "plugins/tasks.md" },
    { "Large Tables & Performance" = "guides/performance.md" },
    { "Compatibility & Performance" = "compatibility.md" },
    { "Migrating" = [
      { "Overview" = "migration/index.md" },
      { "From Django Admin" = "migration/from-django-admin.md" },
      { "From SQLAdmin" = "migration/from-sqladmin.md" },
      { "From Flask-Admin" = "migration/from-flask-admin.md" },
    ] },
    { "Examples" = [
      { "Overview" = "examples.md" },
      { "ERP (Bookkeeping)" = "examples/erp.md" },
    ] },
  ] },
  { "Plugins" = [
    { "Overview" = "plugins/index.md" },
    { "Writing a Plugin" = "plugins/authoring.md" },
    { "Hook Reference" = "plugins/hooks.md" },
  ] },
  { "Frontend" = [
    { "Overview" = "frontend/overview.md" },
    { "Widgets" = "frontend/widgets.md" },
    { "HTMX Patterns" = "frontend/htmx_patterns.md" },
  ] },
  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Application" = "api/application.md" },
    { "Views" = "api/views.md" },
    { "Core Components" = "api/core.md" },
    { "Adapters" = "api/adapters.md" },
    { "Routing" = "api/routing.md" },
    { "Authentication & Permissions" = "api/auth.md" },
    { "Plugins" = "api/plugins.md" },
    { "Uploads" = "api/uploads.md" },
    { "Realtime" = "api/realtime.md" },
  ] },
  { "Community" = [
    { "Contributing" = "contributing.md" },
    { "Changelog" = "changelog.md" },
    { "Versioning & Deprecation" = "versioning.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
]

[project.theme]
# Keep the Material for MkDocs look (Roboto, classic stylesheets) instead of Zensical's "modern" default.
variant = "classic"
logo = "assets/logo.svg"
favicon = "assets/favicon.ico"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "content.code.copy",
  "search.suggest",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/yevheniidehtiar"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/yevheniidehtiar/"

# Search is built into Zensical and enabled by default — no plugin entry needed.

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = true

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
tables = {}
pymdownx.highlight = {}

[project.markdown_extensions.mdx_include]
base_path = "."
