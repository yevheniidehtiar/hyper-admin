name: Demo
permissions:
  contents: read

# Nightly reset of the hosted ERP demo on Render (render.yaml): a redeploy starts the
# service from freshly seeded data. Deploys on develop commits are done by Render itself.
# Needs RENDER_DEPLOY_HOOK (the service's deploy hook URL, a secret of the "demo"
# environment); without it the job no-ops. Never add a pull_request trigger.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: demo
    steps:
      - name: Trigger a Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK not set; skipping the demo reset."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$RENDER_DEPLOY_HOOK"
