name: Deploy Docs

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      # Zensical (successor to Material for MkDocs); config lives in zensical.toml.
      # Zensical has no --strict flag; fail the deploy unless the build reports no issues.
      - run: |
          set -o pipefail
          uv run zensical build --clean 2>&1 | tee build.log
          grep -q 'No issues found' build.log
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
