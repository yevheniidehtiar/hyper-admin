name: Test
permissions:
  contents: read

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - develop
      - master

# A newer push to the same PR supersedes the run in progress. Pushes to
# develop/master and tags are never cancelled.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # ``poe lint`` (every pre-commit hook: ruff, mypy, basedpyright, ...) runs
    # once, on the lowest supported Python and the locked set, instead of in
    # every matrix row below.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-extras --python 3.11

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint package
        run: uv run poe lint

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]

    name: Python ${{ matrix.python-version }} (resolution=${{ matrix.resolution }})
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.resolution }}

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        # "highest" installs exactly what uv.lock pins; "lowest-direct" cannot be
        # locked by definition, so it re-resolves (the step above still guards the lock).
        # That re-resolve rewrites uv.lock, and any later plain `uv run` would re-lock
        # at highest and reinstall. So restore the committed lock and set UV_NO_SYNC
        # for every following step (nested `uv run` in pre-commit hooks included).
        run: |
          if [ "${{ matrix.resolution }}" = "highest" ]; then
            uv sync --locked --all-extras --python ${{ matrix.python-version }}
          else
            uv sync --all-extras --python ${{ matrix.python-version }} --resolution ${{ matrix.resolution }}
            git checkout -- uv.lock
            echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
          fi

      - name: Test package
        run: uv run poe test:unit

      - name: Security checks
        # Audits the shipped (locked, highest) set. lowest-direct rows are a
        # compatibility check of the declared floors, whose old releases carry
        # known advisories by definition.
        if: matrix.resolution == 'highest'
        run: uv run poe security-check

  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            resolution: "highest"
          - python-version: "3.11"
            resolution: "lowest-direct"

    name: Python ${{ matrix.python-version }} (resolution=${{ matrix.resolution }})
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.resolution }}

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        # "highest" installs exactly what uv.lock pins; "lowest-direct" cannot be
        # locked by definition, so it re-resolves (the step above still guards the lock).
        # That re-resolve rewrites uv.lock, and any later plain `uv run` would re-lock
        # at highest and reinstall. So restore the committed lock and set UV_NO_SYNC
        # for every following step (nested `uv run` in pre-commit hooks included).
        run: |
          if [ "${{ matrix.resolution }}" = "highest" ]; then
            uv sync --locked --all-extras --python ${{ matrix.python-version }}
          else
            uv sync --all-extras --python ${{ matrix.python-version }} --resolution ${{ matrix.resolution }}
            git checkout -- uv.lock
            echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
          fi

      - name: Test package
        run: uv run poe test:unit

      - name: Security checks
        # Audits the shipped (locked, highest) set. lowest-direct rows are a
        # compatibility check of the declared floors, whose old releases carry
        # known advisories by definition.
        if: matrix.resolution == 'highest'
        run: uv run poe security-check

  e2e:
    # The Playwright suite runs once, on the highest Python and the locked set,
    # split into shards: every shard takes every Nth test file (sorted) and runs
    # them with pytest-xdist (tests/e2e/conftest.py sizes the worker pool).
    name: E2E (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      UV_PYTHON: "3.14"
      E2E_SHARDS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-extras --python 3.14

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: E2E Test package (shard ${{ matrix.shard }} of ${{ env.E2E_SHARDS }})
        run: |
          files=$(find tests/e2e -maxdepth 1 -name 'test_*.py' | sort \
            | awk -v n="$E2E_SHARDS" -v s="${{ matrix.shard }}" 'NR % n == (s - 1)')
          echo "$files"
          uv run pytest -n auto $files

      - name: Upload visual regression diffs
        # Baselines must be rendered on the CI runner; the actual/diff PNGs are the
        # source for refreshing a drifted baseline (see tests/e2e/test_visual_regression.py).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-shard-${{ matrix.shard }}
          path: tests/e2e/snapshots/**/*.*.png
          if-no-files-found: ignore
          retention-days: 7
