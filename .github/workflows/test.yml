name: Test
permissions:
  contents: read

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        resolution: ["highest", "lowest-direct"]

    name: Python ${{ matrix.python-version }} (resolution=${{ matrix.resolution }})
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        # "highest" installs exactly what uv.lock pins; "lowest-direct" cannot be
        # locked by definition, so it re-resolves (the step above still guards the lock).
        # That re-resolve rewrites uv.lock, and any later plain `uv run` would re-lock
        # at highest and reinstall. So restore the committed lock and set UV_NO_SYNC
        # for every following step (nested `uv run` in pre-commit hooks included).
        run: |
          if [ "${{ matrix.resolution }}" = "highest" ]; then
            uv sync --locked --all-extras --python ${{ matrix.python-version }}
          else
            uv sync --all-extras --python ${{ matrix.python-version }} --resolution ${{ matrix.resolution }}
            git checkout -- uv.lock
            echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
          fi

      - name: Lint package
        run: uv run poe lint

      - name: Test package
        run: uv run poe test:unit

      - name: Security checks
        # Audits the shipped (locked, highest) set. lowest-direct rows are a
        # compatibility check of the declared floors, whose old releases carry
        # known advisories by definition.
        if: matrix.resolution == 'highest'
        run: uv run poe security-check

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: E2E Test package
        run: uv run poe test:e2e

      - name: Upload visual regression diffs
        # Baselines must be rendered on the CI runner; the actual/diff PNGs are the
        # source for refreshing a drifted baseline (see tests/e2e/test_visual_regression.py).
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-diffs-py${{ matrix.python-version }}-${{ matrix.resolution }}
          path: tests/e2e/snapshots/**/*.*.png
          if-no-files-found: ignore
          retention-days: 7

  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            resolution: "highest"
          - python-version: "3.10"
            resolution: "lowest-direct"

    name: Python ${{ matrix.python-version }} (resolution=${{ matrix.resolution }})
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        # "highest" installs exactly what uv.lock pins; "lowest-direct" cannot be
        # locked by definition, so it re-resolves (the step above still guards the lock).
        # That re-resolve rewrites uv.lock, and any later plain `uv run` would re-lock
        # at highest and reinstall. So restore the committed lock and set UV_NO_SYNC
        # for every following step (nested `uv run` in pre-commit hooks included).
        run: |
          if [ "${{ matrix.resolution }}" = "highest" ]; then
            uv sync --locked --all-extras --python ${{ matrix.python-version }}
          else
            uv sync --all-extras --python ${{ matrix.python-version }} --resolution ${{ matrix.resolution }}
            git checkout -- uv.lock
            echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
          fi

      - name: Lint package
        run: uv run poe lint

      - name: Test package
        run: uv run poe test:unit

      - name: Security checks
        # Audits the shipped (locked, highest) set. lowest-direct rows are a
        # compatibility check of the declared floors, whose old releases carry
        # known advisories by definition.
        if: matrix.resolution == 'highest'
        run: uv run poe security-check
