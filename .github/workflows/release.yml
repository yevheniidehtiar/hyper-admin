name: Release

# Tags master, creates the GitHub release and publishes to PyPI in one run.
#
# The version bump is a normal commit in the develop -> master PR; this
# workflow never pushes a commit. It checks `inputs.version` against
# pyproject.toml, pushes the v<version> tag, creates the GitHub release
# (a pre-release for a/b/rc versions) and calls publish.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal [project].version in pyproject.toml (e.g. 0.5.0a1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          PYPROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::inputs.version ($VERSION) does not match pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
          PRERELEASE=""
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION" $PRERELEASE

  publish:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
