name: Load Test

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/hyperadmin/adapters/**"
      - "src/hyperadmin/views/**"
      - "src/hyperadmin/core/**"
      - "examples/erp/loadtest/**"
      - ".github/workflows/loadtest.yml"
  schedule:
    - cron: "0 3 * * *"  # nightly full run at 03:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: "Smoke: runs per side (base and head each run this many times)"
        default: "5"
        type: string
      tolerance:
        description: "Smoke: allowed relative regression, 0.15 = 15%"
        default: "0.15"
        type: string

permissions:
  contents: read

jobs:
  # SQLite regression gate on PRs that touch the hot query paths. Runs base and head alternately
  # (base, head, base, head, ...) on the same runner so runner drift hits both sides equally, then
  # compares per-endpoint medians. See examples/erp/loadtest/README.md.
  smoke:
    name: Regression gate (SQLite, base vs head)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUNS: ${{ inputs.runs || '5' }}
      TOLERANCE: ${{ inputs.tolerance || '0.15' }}
      RUN_TIME: 90s
      USERS: "20"
      SPAWN_RATE: "5"
      MIN_RUNS: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR head commit itself, not the refs/pull/N/merge commit: the merge ref pulls
          # unrelated develop changes into head that base lacks.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: actions/checkout@v7
        with:
          # PR base commit, or develop for a manual dispatch.
          ref: ${{ github.event.pull_request.base.sha || 'develop' }}
          path: base
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install base and head
        run: |
          (cd base && uv sync --locked --all-extras)
          (cd head && uv sync --locked --all-extras)

      # The script, the aggregate CLI and the load-test scenario always come from head: head's
      # examples/erp/loadtest/ is copied over base's, so both sides run the same workload even
      # when the PR edits the locustfile. Each iteration starts a fresh app and database.
      - name: Run base and head alternately
        run: |
          cp -R head/examples/erp/loadtest/. base/examples/erp/loadtest/
          mkdir -p out/base out/head
          for i in $(seq 1 "$RUNS"); do
            for side in base head; do
              FIRST_RUN="$i" head/scripts/loadtest_repeat.sh "$side" "out/$side" 1
            done
          done

      - name: Aggregate and compare
        working-directory: head
        run: |
          shopt -s nullglob
          out="$GITHUB_WORKSPACE/out"
          base_csvs=("$out"/base/run*_stats.csv)
          head_csvs=("$out"/head/run*_stats.csv)
          if [ "${#base_csvs[@]}" -eq 0 ] || [ "${#head_csvs[@]}" -eq 0 ]; then
            echo "no stats CSVs produced (base: ${#base_csvs[@]}, head: ${#head_csvs[@]})" >&2
            exit 1
          fi
          uv run python -m examples.erp.loadtest.baselines aggregate \
            --stats "${base_csvs[@]}" --out "$out/base-agg.json" --min-runs "$MIN_RUNS"
          uv run python -m examples.erp.loadtest.baselines aggregate \
            --stats "${head_csvs[@]}" --out "$out/head-agg.json" --min-runs "$MIN_RUNS"
          uv run python -m examples.erp.loadtest.baselines compare \
            --base "$out/base-agg.json" --head "$out/head-agg.json" \
            --tolerance "$TOLERANCE" --min-runs "$MIN_RUNS" --report "$out/report.md"

      # compare appends its report to the summary itself; this covers any earlier failure.
      - name: Step summary when no report exists
        if: always() && !cancelled()
        run: |
          if [ ! -s out/report.md ]; then
            {
              echo "### Load test regression gate"
              echo
              echo "**No report was produced**: an earlier step failed before the comparison."
              echo "See the step logs and the app logs in the \`locust-smoke-report\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CSVs and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locust-smoke-report
          path: out/

  # Heavy nightly run against PostgreSQL via docker-compose: 100K rows, 100 users, 3 runs of 3 min.
  nightly:
    name: Nightly (PostgreSQL, 100 users, 3 x 3m)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras

      - name: Bring up PostgreSQL + app
        run: |
          docker compose -f docker-compose.loadtest.yml up -d --build postgres app
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/admin/login || true)
            [ "$code" = "200" ] && break
            sleep 5
          done

      - name: Seed 100K rows into PostgreSQL
        run: |
          docker compose -f docker-compose.loadtest.yml exec -T app \
            uv run hyperadmin seed --count 100000 \
            --database-url postgresql://hyperadmin:hyperadmin@postgres:5432/erp --no-progress

      - name: Run Locust 3 times (headless, 100 users, 3m each)
        env:
          LOADTEST_USER: admin
          LOADTEST_PASSWORD: admin
          LOADTEST_MAX_ID: "5000"
        run: |
          mkdir -p out
          for i in 1 2 3; do
            uv run locust -f examples/erp/loadtest/locustfile.py \
              --host http://127.0.0.1:8000 \
              --headless --users 100 --spawn-rate 20 --run-time 3m \
              --reset-stats --csv "out/run${i}" --html "out/run${i}-report.html" --only-summary
          done

      - name: Aggregate runs
        run: |
          uv run python -m examples.erp.loadtest.baselines aggregate \
            --stats out/run1_stats.csv out/run2_stats.csv out/run3_stats.csv \
            --out out/nightly-postgres.json

      # A recorded aggregate is committed by hand from the uploaded artifact; no numbers are
      # invented here. Without the file there is nothing to compare against.
      - name: Compare against recorded aggregate
        env:
          BASELINE: examples/erp/loadtest/baselines/nightly-postgres.json
        run: |
          if [ ! -f "$BASELINE" ]; then
            echo "::notice::No $BASELINE recorded, skipping the nightly comparison. Commit out/nightly-postgres.json from this run's artifact to enable it."
            exit 0
          fi
          uv run python -m examples.erp.loadtest.baselines compare \
            --base "$BASELINE" --head out/nightly-postgres.json \
            --tolerance 0.25 --report out/report.md

      - name: Show app logs
        if: failure()
        run: docker compose -f docker-compose.loadtest.yml logs --no-color --tail 300 app

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.loadtest.yml down -v

      - name: Upload Locust report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locust-nightly-report
          path: out/
