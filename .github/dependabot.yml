version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: scope
    groups:
      ci-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"  # bumps pyproject.toml and the committed uv.lock together
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "build"
      include: scope
    # Dev tooling lives in the `dev` extra, not [dependency-groups]. Dependabot's uv
    # updater may classify every pyproject dependency as production
    # (dependabot-core#13202); if no dev-bump PR appears after the first weekly run,
    # drop this filter or move the dev extra to [dependency-groups].
    allow:
      - dependency-type: "development"
    versioning-strategy: "increase"
    groups:
      development-dependencies:
        dependency-type: "development"
