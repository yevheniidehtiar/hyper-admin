# https://docs.codecov.com/docs/codecov-yaml
# Every changed line must be covered (patch 100%); the project total may never drop.
coverage:
  precision: 2
  round: down
  status:
    patch:
      default:
        target: 100%
        threshold: 0%
    project:
      default:
        target: auto
        threshold: 0%

comment:
  layout: "diff, files"
  require_changes: false
