<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" font-family="Inter, -apple-system, system-ui, sans-serif">
  <title>HyperAdmin autopilot workflow</title>
  <desc>A launchd agent runs a tick every 15 minutes. The tick does deterministic checks and starts headless Claude Code jobs. Story PRs merge into an epic branch without a human; the owner approves one PR per epic into develop.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1100" height="860" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">HyperAdmin Autopilot</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#64748b">Local supervisor, one branch per epic, one owner approval per epic</text>

  <!-- ======================================== -->
  <!-- LOCAL AUTOPILOT (top)                    -->
  <!-- ======================================== -->
  <rect x="30" y="80" width="1040" height="170" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="550" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">LOCAL AUTOPILOT (owner's Mac, Max subscription, no API key)</text>

  <!-- launchd -->
  <rect x="55" y="122" width="190" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">launchd</text>
  <text x="150" y="160" text-anchor="middle" font-size="10" fill="#64748b">com.hyperadmin.autopilot</text>
  <text x="150" y="176" text-anchor="middle" font-size="9" fill="#7c3aed">every 15 min, single instance</text>

  <line x1="245" y1="155" x2="281" y2="155" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Tick -->
  <rect x="285" y="122" width="250" height="66" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Tick (ops/autopilot/autopilot.sh)</text>
  <text x="410" y="160" text-anchor="middle" font-size="10" fill="#64748b">gh + git checks, zero tokens</text>
  <text x="410" y="176" text-anchor="middle" font-size="9" fill="#7c3aed">merges, rebases, labels, janitor</text>

  <line x1="535" y1="155" x2="571" y2="155" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="553" y="148" text-anchor="middle" font-size="8" fill="#2563eb">spawns</text>

  <!-- Jobs -->
  <rect x="575" y="122" width="250" height="66" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Headless jobs (claude -p)</text>
  <text x="700" y="160" text-anchor="middle" font-size="10" fill="#64748b">worktree pool ap-1..3, max 3 workers</text>
  <text x="700" y="176" text-anchor="middle" font-size="9" fill="#16a34a">tool allowlist, wall-clock kill</text>

  <line x1="825" y1="155" x2="861" y2="155" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- State -->
  <rect x="865" y="122" width="180" height="66" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="955" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">state.json</text>
  <text x="955" y="160" text-anchor="middle" font-size="9" fill="#a16207">~/.hyperadmin-autopilot/</text>
  <text x="955" y="176" text-anchor="middle" font-size="9" fill="#a16207">cooldown, jobs, retry counters</text>

  <!-- Job names -->
  <text x="550" y="216" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">Jobs</text>
  <text x="550" y="234" text-anchor="middle" font-size="10" fill="#64748b">implement  ·  review  ·  fix-pr  ·  fix-develop  ·  approve-sdd  ·  integrate-epic  ·  digest</text>

  <!-- ======================================== -->
  <!-- EPIC BRANCH FLOW (middle)                -->
  <!-- ======================================== -->
  <rect x="30" y="270" width="1040" height="260" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="550" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">EPIC BRANCH FLOW</text>
  <text x="550" y="310" text-anchor="middle" font-size="10" fill="#16a34a">Story PRs merge into epic/&lt;slug&gt; without a human. The epic PR to develop is the human gate.</text>

  <!-- Stories -->
  <rect x="45" y="324" width="180" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">.meta/ stories</text>
  <text x="135" y="362" text-anchor="middle" font-size="9" fill="#64748b">todo, deps done, no file overlap</text>

  <line x1="225" y1="350" x2="246" y2="350" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- approve-sdd -->
  <rect x="250" y="324" width="180" height="52" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">approve-sdd</text>
  <text x="340" y="362" text-anchor="middle" font-size="9" fill="#64748b">Software architect, Opus</text>

  <line x1="430" y1="350" x2="451" y2="350" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- implement -->
  <rect x="455" y="324" width="180" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="545" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">implement</text>
  <text x="545" y="362" text-anchor="middle" font-size="9" fill="#64748b">implement-feature skill, Opus</text>

  <line x1="635" y1="350" x2="656" y2="350" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="646" y="342" text-anchor="middle" font-size="8" fill="#16a34a">PR</text>

  <!-- review -->
  <rect x="660" y="324" width="180" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">review</text>
  <text x="750" y="362" text-anchor="middle" font-size="9" fill="#64748b">Code reviewer, Sonnet</text>

  <line x1="840" y1="350" x2="861" y2="350" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- tick merge -->
  <rect x="865" y="324" width="180" height="52" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Tick merges</text>
  <text x="955" y="362" text-anchor="middle" font-size="9" fill="#64748b">ai-approved + green, rebase-merge</text>

  <!-- fix-pr loop -->
  <rect x="640" y="404" width="220" height="44" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="423" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">fix-pr</text>
  <text x="750" y="438" text-anchor="middle" font-size="9" fill="#64748b">CI red, conflicts, findings; max 3 rounds</text>
  <line x1="710" y1="376" x2="710" y2="400" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="790" y1="404" x2="790" y2="380" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="702" y="393" text-anchor="end" font-size="8" fill="#dc2626">ai-changes-requested</text>
  <text x="798" y="393" font-size="8" fill="#16a34a">push</text>

  <!-- tick merge -> integrate -->
  <line x1="955" y1="376" x2="955" y2="460" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="963" y="422" font-size="8" fill="#16a34a">all stories done</text>

  <!-- integrate-epic -->
  <rect x="865" y="464" width="180" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="955" y="486" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">integrate-epic</text>
  <text x="955" y="502" text-anchor="middle" font-size="9" fill="#64748b">close-epic commit, PR ready</text>

  <line x1="865" y1="490" x2="844" y2="490" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Owner gate -->
  <rect x="660" y="472" width="180" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="750" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Owner approves once</text>

  <line x1="660" y1="490" x2="639" y2="490" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- develop -->
  <rect x="455" y="464" width="180" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="545" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">develop</text>
  <text x="545" y="502" text-anchor="middle" font-size="9" fill="#166534">auto-merge by rebase</text>

  <line x1="455" y1="490" x2="434" y2="490" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- GitPM Sync -->
  <rect x="250" y="464" width="180" height="52" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="486" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">GitPM Sync (CI)</text>
  <text x="340" y="502" text-anchor="middle" font-size="9" fill="#64748b">issues and milestones updated</text>

  <line x1="250" y1="490" x2="229" y2="490" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Release -->
  <rect x="45" y="472" width="180" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="135" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Release: owner, manual</text>

  <!-- Epic branch note -->
  <text x="340" y="428" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Lock = creating epic/&lt;slug&gt; via the API</text>
  <text x="340" y="444" text-anchor="middle" font-size="9" fill="#16a34a">draft epic PR from day one; .meta changes in two commits (open, close)</text>

  <!-- ======================================== -->
  <!-- SELF-UNBLOCKING AND SELF-REPAIR          -->
  <!-- ======================================== -->
  <rect x="30" y="550" width="1040" height="124" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="550" y="574" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">SELF-UNBLOCKING AND SELF-REPAIR</text>

  <!-- Decision ladder -->
  <rect x="55" y="588" width="320" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="215" y="608" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Decision ladder</text>
  <text x="215" y="626" text-anchor="middle" font-size="10" fill="#64748b">memory → story, SDD, code → research subagent</text>
  <text x="215" y="644" text-anchor="middle" font-size="9" fill="#2563eb">→ most reversible option, recorded under ## Assumptions</text>

  <!-- Hard stops -->
  <rect x="395" y="588" width="320" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="555" y="608" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Hard stops → needs-human</text>
  <text x="555" y="626" text-anchor="middle" font-size="10" fill="#64748b">secrets, billing, public mirror, deleting data, PyPI</text>
  <text x="555" y="644" text-anchor="middle" font-size="10" fill="#64748b">breaking API, dependency floors, migrations</text>

  <!-- Self-repair -->
  <rect x="735" y="588" width="310" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="608" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Self-repair</text>
  <text x="890" y="626" text-anchor="middle" font-size="10" fill="#64748b">develop red → fix-develop PR (owner approves)</text>
  <text x="890" y="644" text-anchor="middle" font-size="10" fill="#64748b">conflicts → tick rebases; Dependabot → digest</text>

  <!-- ======================================== -->
  <!-- RULES AND INFRASTRUCTURE (bottom)        -->
  <!-- ======================================== -->
  <rect x="30" y="694" width="1040" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="718" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">RULES AND INFRASTRUCTURE</text>

  <!-- Rules -->
  <rect x="55" y="732" width="240" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="175" y="752" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Rules (.claude/rules/)</text>
  <text x="175" y="770" text-anchor="middle" font-size="10" fill="#64748b">code-style, testing, git-workflow</text>
  <text x="175" y="786" text-anchor="middle" font-size="10" fill="#64748b">planning-playbook, conflict-avoidance</text>
  <text x="175" y="802" text-anchor="middle" font-size="10" fill="#64748b">sdd-conventions, bdd-conventions</text>
  <text x="175" y="818" text-anchor="middle" font-size="9" fill="#7c3aed">CONSTITUTION.md above all</text>

  <!-- Skills and agents -->
  <rect x="325" y="732" width="240" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="445" y="752" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Skills and agents</text>
  <text x="445" y="770" text-anchor="middle" font-size="10" fill="#64748b">implement-feature, fix-issue</text>
  <text x="445" y="786" text-anchor="middle" font-size="10" fill="#64748b">software-architect</text>
  <text x="445" y="802" text-anchor="middle" font-size="10" fill="#64748b">hyper-admin-code-reviewer</text>
  <text x="445" y="818" text-anchor="middle" font-size="10" fill="#64748b">project-manager (digest), triage auditor</text>

  <!-- Labels -->
  <rect x="595" y="732" width="240" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="715" y="752" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Labels</text>
  <text x="715" y="770" text-anchor="middle" font-size="10" fill="#64748b">ai-approved | ai-changes-requested</text>
  <text x="715" y="786" text-anchor="middle" font-size="10" fill="#64748b">needs-human</text>
  <text x="715" y="802" text-anchor="middle" font-size="10" fill="#64748b">ap:in-progress → ap:in-review → ap:done</text>
  <text x="715" y="818" text-anchor="middle" font-size="10" fill="#64748b">superseded</text>

  <!-- Safety rails -->
  <rect x="865" y="732" width="180" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="955" y="752" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Safety rails</text>
  <text x="955" y="770" text-anchor="middle" font-size="10" fill="#64748b">3 workers (1 if low memory)</text>
  <text x="955" y="786" text-anchor="middle" font-size="10" fill="#64748b">3 fix rounds, 2 review rounds</text>
  <text x="955" y="802" text-anchor="middle" font-size="10" fill="#64748b">usage-limit cooldown</text>
  <text x="955" y="818" text-anchor="middle" font-size="10" fill="#64748b">deny-by-default permissions</text>
</svg>
