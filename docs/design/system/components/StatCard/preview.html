<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme")||"light";document.documentElement.setAttribute("data-theme",t);var d=new URLSearchParams(location.search).get("dir");if(d)document.documentElement.setAttribute("dir",d);})();</script><meta charset="utf-8"><title>StatCard — preview</title><style>body{margin:0;background:var(--ha-surface-base)} .pv{padding:16px;display:flex;flex-direction:column;gap:16px} .pv-l{font:500 12px/18px var(--font-sans);color:var(--ha-color-text-muted);margin:0 0 6px}</style></head>

<section class="ha-card ha-stat" aria-label="Days to get paid" data-testid="stat-dso"><span class="ha-stat__label">Days to get paid</span><span class="ha-stat__value">18</span><span class="ha-delta ha-delta--up"><svg class="ha-icon ha-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>−3<span class="ha-sr-only">, better</span><span class="ha-muted" style="font-weight:400">&nbsp;vs last month</span></span><svg class="ha-chart ha-spark" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path class="line s1" d="M2.0 4.0 L19.8 8.0 L37.6 12.0 L55.5 12.0 L73.3 16.0 L91.1 20.0 L108.9 20.0 L126.7 24.0 L144.5 28.0 L162.4 24.0 L180.2 32.0 L198.0 36.0" vector-effect="non-scaling-stroke"/><circle class="f1" cx="198.0" cy="36.0" r="3"/></svg></section>
<section class="ha-card ha-stat" aria-busy="true" aria-label="Cash position, loading"><span class="ha-stat__label">Cash position</span><span class="ha-skel" style="block-size:30px;inline-size:60%;margin-block:4px"></span><span class="ha-skel" style="inline-size:40%"></span></section>
